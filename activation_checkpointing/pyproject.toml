[project]
name = "activation-checkpointing-explained"
version = "0.1.0"
description = "A faithful, standalone explainer for PyTorch activation checkpointing"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "torch==2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
