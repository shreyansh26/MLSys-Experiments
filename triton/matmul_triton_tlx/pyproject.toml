[project]
name = "matmul-triton-tlx"
version = "0.1.0"
description = "Interview-oriented PyTorch, Triton TMA, TLX, and Gluon matmul lab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.4.6",
    "pandas>=2.3",
    "torch==2.12.0.dev20260408+cu128",
    "triton==3.7.0+gita5d0d584; sys_platform == 'linux'",
    "triton-utlx==3.7.1; sys_platform == 'linux'",
]

[tool.uv]
prerelease = "allow"
override-dependencies = [
    "triton==3.7.0+gita5d0d584; sys_platform == 'linux'",
]

[tool.uv.sources]
torch = { index = "pytorch-nightly-cu128" }
triton = { path = ".deps/triton" }

[[tool.uv.index]]
name = "pytorch-nightly-cu128"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true
